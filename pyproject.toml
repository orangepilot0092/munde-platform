[project]
name = "munde-platform"
version = "0.1.0"
description = "Sovereign Intelligence Platform for Maharashtra"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "greenlet",
    "psycopg2-binary",
    "httpx",
    "structlog",
    "prometheus-fastapi-instrumentator",
    "dagster>=1.13.15",
    "dagster-postgres>=0.29.15",
    "pandas>=3.0.5",
    "dagster-webserver>=1.13.15",
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munde"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
