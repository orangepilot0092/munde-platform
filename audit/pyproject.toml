[tool.poetry]
name = "sahyadri-platform"
version = "0.1.0"
description = "Open-source data and intelligence platform for Maharashtra."
authors = ["Project Sahyadri Team <team@sahyadri.org>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic-settings = "^2.1.0"
psycopg2-binary = "^2.9.9"
minio = "^7.2.0"
redis = "^5.0.1"
prometheus-client = "^0.19.0"
alembic = "^1.13.0"
geoalchemy2 = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
slowapi = "^0.1.9"
sqlalchemy = {version = "^2.0.51", extras = ["asyncio"]}
asyncpg = "^0.31.0"
dagster = "^1.6.0"
dagster-postgres = "^0.22.0"
dagster-webserver = "^1.6.0"
python-json-logger = "^2.0.7"
shapely = "^2.0.0"
pgvector = "^0.2.5"
pytesseract = "^0.3.10"
pdf2image = "^1.17.0"
requests = "^2.34.2"
opensearch-py = "^3.2.0"
boto3 = "^1.43.42"
tenacity = "^9.1.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.0"
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
pre-commit = "^3.6.0"
httpx = "^0.27.0"
pytest-asyncio = "^0.23.0"
mkdocstrings-python = "^1.9.0"
mkdocs-autorefs = "^1.0.0"
mkdocs-gen-files = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
