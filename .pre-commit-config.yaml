repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.0, psycopg2-binary, types-requests, types-redis, fastapi, starlette, prometheus-client, dagster, pytest]
        args: [--strict, --ignore-missing-imports]
  
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast subset)
        entry: poetry run pytest tests/ -x -q --tb=short -m "not slow"
        language: system
        pass_filenames: false
        always_run: true
