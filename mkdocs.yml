site_name: Project Sahyadri
site_description: Enterprise Agentic AI Platform for Government Intelligence
site_url: https://orangepilot0092.github.io/sahyadri-platform/
repo_url: https://github.com/orangepilot0092/sahyadri-platform

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
  - autorefs

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Local Development: getting-started/local-dev.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Data Flow: architecture/data-flow.md
      - Security Model: architecture/security.md
  - API Reference:
      - Core Services: api/core.md
      - Domain APIs: api/domains.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - footnotes
  - pymdownx.details
