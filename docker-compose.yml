services:
  db:
    image: pgvector/pgvector:pg16
    container_name: munde-db
    environment:
      POSTGRES_USER: munde
      POSTGRES_PASSWORD: munde_dev_password
      POSTGRES_DB: munde_core
    ports:
      - "5432:5432"
    volumes:
      - munde_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munde -d munde_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: munde-minio
    environment:
      MINIO_ROOT_USER: munde_minio
      MINIO_ROOT_PASSWORD: munde_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - munde_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: munde-redis
    ports:
      - "6379:6379"
    volumes:
      - munde_redis_data:/data

volumes:
  munde_db_data:
  munde_minio_data:
  munde_redis_data:
